# Configuración principal del proyecto YOLO

# Configuración del detector
detector:
  model_name: 'yolov8n.pt'      # Modelo YOLO a usar
  confidence: 0.5               # Umbral de confianza (0-1)
  device: 'cpu'                 # 'cpu', 'cuda', 'mps'
  iou_threshold: 0.45           # Umbral de IoU para NMS

# Configuración del sistema de alertas
alerts:
  enabled: true                 # Activar sistema de alertas
  dwell_threshold_sec: 3.0      # Segundos para activar alerta por permanencia
  alert_cooldown_sec: 5.0       # Segundos entre alertas del mismo objeto

# Configuración de almacenamiento
storage:
  type: 'json'                  # 'json', 'csv'
  output_dir: 'output'          # Directorio de salida
  save_detections: true         # Guardar resultados de detección
  save_alerts: true             # Guardar alertas

# Configuración de logging
logger:
  level: 'INFO'                 # DEBUG, INFO, WARNING, ERROR, CRITICAL
  log_dir: 'logs'               # Directorio de logs
  file_name: 'app.log'          # Nombre del archivo de log
