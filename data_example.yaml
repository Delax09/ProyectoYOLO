# Ejemplo de configuración de dataset para entrenamiento YOLO
# Copia este archivo y ajusta los paths según tu estructura

path: /ruta/absoluta/a/tu/dataset  # Ruta base del dataset

# Rutas relativas a 'path'
train: images/train
val: images/val
test: images/test  # Opcional

# Número de clases
nc: 2

# Nombres de las clases (en orden)
names:
  0: persona
  1: auto

# Nota: Asegúrate de que tus labels estén en formato YOLO:
# Un archivo .txt por imagen con el formato:
# <class_id> <x_center> <y_center> <width> <height>
# 
# Todas las coordenadas deben estar normalizadas (0-1)